services:
  - type: web
    name: reunion-vote
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false          # only used once, to delete the old reunion data
      - key: YOUTUBE_API_KEY
        sync: false          # optional: lists every video with exact totals
