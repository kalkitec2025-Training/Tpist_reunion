services:
  - type: web
    name: reunion-vote
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # set in the Render dashboard
      - key: DATABASE_URL
        sync: false          # free Neon Postgres connection string (see README)
      - key: GOOGLE_CLIENT_ID
        sync: false          # Google sign-in client ID (see README)
      - key: STORY_START
        value: "2026-11-20T12:30:00+05:30"   # when the scripted hourly results begin
      - key: STORY_SEED
        value: "20261120"
