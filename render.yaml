services:
  - type: web
    name: reunion-vote
    runtime: node
    plan: free               # see README: switch to "starter" + disk to keep uploaded videos
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you to type it
      - key: STORY_START
        value: "2026-11-20T12:30:00+05:30"   # when the hourly vote story begins
      - key: STORY_SEED
        value: "20261120"                    # change for a different story
