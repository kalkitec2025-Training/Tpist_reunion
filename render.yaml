# BACK2CAMPUS on Render.
# Create this as a NEW web service (Blueprint or "New Web Service" on this branch).
# Do not point the existing "reunion-vote" service at this branch unless you want
# this app to replace the page it serves today.
services:
  - type: web
    name: back2campus
    runtime: node
    plan: free
    branch: back2campus-frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false   # paste the existing Postgres connection string; used from the backend phase on
