<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reunion Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4F5F8; --ink:#14161C; --muted:#5D6270; --line:#E3E5EB; --blue:#2B4ACB; --ok:#1F7A4D; --red:#B42318; --acc:#C2410C; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter, system-ui, sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .hin { max-width:1180px; margin:0 auto; padding:12px 20px 0; }
  .hrow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .ttl { font-weight:700; font-size:16px; } .sub { color:var(--muted); font-size:13px; }
  nav { display:flex; gap:4px; overflow-x:auto; margin-top:10px; }
  nav button { border:0; background:none; padding:10px 14px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
  nav button.on { color:var(--ink); border-bottom-color:var(--acc); }
  main { max-width:1180px; margin:0 auto; padding:20px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); align-items:start; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  h2 { margin:0 0 4px; font-size:15px; } .hint { color:var(--muted); font-size:13px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=number], input[type=password], input[type=tel], input[type=search], select, textarea { width:100%; min-height:40px; border:1px solid #D5D8E0; border-radius:8px; padding:8px 10px; background:#fff; }
  textarea { min-height:70px; resize:vertical; }
  .f2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .f3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
  @media (max-width:640px) { .f2, .f3 { grid-template-columns:minmax(0,1fr); } }
  .check { display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); font-size:14px; margin:0; }
  .check input { width:18px; height:18px; accent-color:var(--blue); }
  .btn { height:38px; padding:0 14px; border-radius:8px; border:1px solid #D5D8E0; background:#fff; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn.p { background:var(--blue); border-color:var(--blue); color:#fff; } .btn.d { background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn.r { color:var(--red); border-color:#F3C7C3; } .btn.s { height:32px; padding:0 10px; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .mt { margin-top:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
  .kpi { background:var(--bg); border-radius:10px; padding:12px; } .kpi b { display:block; font-size:22px; } .kpi span { font-size:12px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:9px 8px; border-top:1px solid #EEF0F4; vertical-align:middle; } th { font-size:12px; color:var(--muted); font-weight:600; border-top:0; }
  .tw { overflow-x:auto; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; background:#EEF0F4; color:var(--muted); margin:2px 4px 2px 0; }
  .pill.g { background:#E5F5EC; color:var(--ok); } .pill.o { background:#FFF1E6; color:var(--acc); } .pill.b { background:#EAEEFC; color:var(--blue); } .pill.r { background:#FDECEC; color:var(--red); }
  .split { display:grid; grid-template-columns:280px minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:860px) { .split { grid-template-columns:minmax(0,1fr); } }
  .elist button { display:block; width:100%; text-align:left; border:0; background:none; padding:10px 12px; border-radius:10px; cursor:pointer; }
  .elist button.on { background:#EEF1FC; } .elist button small { display:block; color:var(--muted); font-size:12px; }
  .crow { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 80px auto; gap:8px; align-items:center; padding:10px 0; border-top:1px solid #EEF0F4; }
  @media (max-width:760px) { .crow { grid-template-columns:minmax(0,1fr) 80px; } .crow .acts { grid-column:1 / -1; } }
  .votes { font-size:20px; font-weight:700; } .votes small { display:block; font-size:11px; color:var(--muted); font-weight:500; }
  .rs { border-top:1px solid #EEF0F4; padding:12px 0; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) minmax(0,1fr); gap:12px; align-items:start; }
  .acc { border-top:1px solid #EEF0F4; padding:10px 0; display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:10px; align-items:center; }
  .acc img, .acc .av { width:40px; height:40px; border-radius:50%; object-fit:cover; background:#E8EEF9; color:#2563EB; display:grid; place-items:center; font-weight:700; }
  .bars div { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; font-size:13px; padding:5px 0; position:relative; }
  .bars i { position:absolute; left:0; bottom:0; height:3px; border-radius:2px; background:#2563EB; opacity:.5; }
  .who { border-top:1px solid #EEF0F4; padding:12px 0; }
  .who summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:10px; align-items:center; }
  .who summary::-webkit-details-marker { display:none; }
  .who img, .who .av { width:40px; height:40px; border-radius:50%; object-fit:cover; background:#E8EEF9; color:#2563EB; display:grid; place-items:center; font-weight:700; }
  .nums { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin-top:2px; } .nums b { color:var(--ink, #1C1D24); }
  .tl { font-size:12px; border-left:2px solid #E3E7EF; margin:6px 0 0 6px; padding-left:12px; }
  .tl div { padding:3px 0; } .tl .v { color:#16A34A; font-weight:700; }
  @media (max-width:760px) { .rs { grid-template-columns:minmax(0,1fr); } }
  .hist { font-size:12px; color:var(--muted); line-height:1.7; }
  #login { max-width:360px; margin:80px auto; }
  .hidden { display:none !important; }
  .toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:99px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="card" id="login">
  <h2>Admin login</h2>
  <p class="hint">Enter the admin password set on the server.</p>
  <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">
  <div class="row mt"><button class="btn p" id="loginBtn">Log in</button></div>
</div>

<div id="app" class="hidden">
  <header><div class="hin">
    <div class="hrow"><div><div class="ttl" id="hTitle">Reunion Admin</div><div class="sub" id="hSub"></div></div>
      <div class="row"><a href="/" target="_blank"><button class="btn">Open app ↗</button></a></div></div>
    <nav id="tabs">
      <button data-t="overview" class="on">Overview</button><button data-t="elections">Elections</button>
      <button data-t="rsvps">Registrations</button><button data-t="plan">Plan & tasks</button><button data-t="activity">Activity</button><button data-t="chat">Chat</button><button data-t="settings">Settings</button>
    </nav>
  </div></header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
let qPass = '';
let PW = sessionStorage.getItem('pw') || '', S = null, tab = 'overview', selE = null, q = '', qStatus = '', sched = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const closeSel = (name, at) => `<select name="${name}"><option value="keep">${at ? (at > Date.now() ? `Closes ${when(at)} (${left(at)})` : `Closed ${when(at)}`) : 'No closing date'}</option>${at ? '<option value="none">Remove closing date</option>' : ''}${[1, 2, 3, 5, 7, 10, 14, 21, 30].map(d => `<option value="${d}">Close in ${d} day${d === 1 ? '' : 's'}</option>`).join('')}</select>`;
const left = at => { const ms = at - Date.now(); if (ms <= 0) return 'closed'; const d = Math.floor((ms + 60000) / 86400000), h = Math.floor((ms + 60000) % 86400000 / 3600000); return d ? `${d} day${d === 1 ? '' : 's'}${h ? ` ${h} hr` : ''} left` : h ? `${h} hr left` : `${Math.max(1, Math.round(ms / 60000))} min left`; };
const whenNm = w => w === 'any' ? 'Any month' : (([y, m]) => `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m - 1]} ${y}`)(String(w).split('-'));
const when = t => t ? new Date(t).toLocaleString('en-IN', { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) : '—';
const passNm = id => ((S && S.settings.passes || []).find(p => p.id === id) || { name: 'No pass yet' }).name;
const STATUS = { new:'Not called', confirmed:'Confirmed', not_reachable:'Not reachable', declined:'Not coming' };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

async function api(url, opts = {}) {
  opts.headers = { ...(opts.headers || {}), 'x-admin-password': PW };
  if (opts.json !== undefined) { opts.body = JSON.stringify(opts.json); opts.headers['Content-Type'] = 'application/json'; delete opts.json; }
  const r = await fetch('/api/admin' + url, opts);
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { sessionStorage.removeItem('pw'); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); throw new Error('Wrong password'); }
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };

async function login() {
  PW = $('pw').value;
  try { await api('/login', { method:'POST' }); sessionStorage.setItem('pw', PW); start(); } catch (e) { toast(e.message); }
}
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', e => e.key === 'Enter' && login());
function start() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); load(); }
async function load() { S = await api('/state'); if (!selE || !S.elections.some(e => e.id === selE)) selE = S.elections[0]?.id; render(); }

$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); sched = null; render(); };

function render() {
  const st = S.settings;
  $('hTitle').textContent = `${st.eventTitle} · Admin`;
  $('hSub').textContent = `${S.rsvps.length} registered of ${st.expected} expected · ${S.accounts} signed-in accounts · storage: ${S.storage === 'postgres' ? 'database (permanent)' : 'file (resets on restart)'}`;
  $('main').innerHTML = ({ overview, elections, rsvps, plan, settings, chat, activity })[tab]();
}

// ------------------------------------------------------------ overview
function overview() {
  const R = S.rsvps, n = f => R.filter(f).length;
  const pick = {}; R.forEach(r => { const k = r.pickup || 'Own transport'; pick[k] = (pick[k] || 0) + 1; });
  const a = S.auto;
  return `${(S.accountList || []).some(a => a.approval === 'pending') ? `<section class="card" style="margin-bottom:16px;border-color:#F5C79C"><h2>${(S.accountList || []).filter(a => a.approval === 'pending').length} new sign-in(s) waiting for your approval</h2><p class="hint">Open <b>Registrations → Signed-in accounts</b> to approve or decline.</p></section>` : ''}<div class="grid">
    <section class="card" style="grid-column:1/-1"><h2>Registrations</h2><p class="hint">Live counts for food, stay and transport planning.</p>
      <div class="kpis">
        <div class="kpi"><b>${R.length}</b><span>Registered</span></div>
        <div class="kpi"><b>${n(r => r.pass === 'platinum')} / ${n(r => r.pass === 'gold')} / ${n(r => r.pass === 'silver')}</b><span>Platinum / Gold / Silver (real)</span></div>
        <div class="kpi"><b>${n(r => !r.pass)}</b><span>Pass not assigned yet</span></div>
        <div class="kpi"><b>${n(r => r.gender === 'male')} / ${n(r => r.gender === 'female')}</b><span>Men / Women (real)</span></div>
        <div class="kpi"><b>${n(r => r.attend === 'both')}</b><span>Both days</span></div>
        <div class="kpi"><b>${n(r => r.attend === 'day1')}</b><span>Day 1 only</span></div>
        <div class="kpi"><b>${n(r => r.overnight)}</b><span>Staying overnight</span></div>
        <div class="kpi"><b>${n(r => r.food === 'veg')}</b><span>Veg</span></div>
        <div class="kpi"><b>${n(r => r.food !== 'veg')}</b><span>Non-veg</span></div>
        <div class="kpi"><b>${n(r => r.pickup)}</b><span>Need pickup</span></div>
        <div class="kpi"><b>${R.reduce((t, r) => t + (r.headcount || 1), 0)}</b><span>Total people incl. family</span></div>
        <div class="kpi"><b>${R.reduce((t, r) => t + (r.spouse ? 1 : 0) + (r.others || 0), 0)}</b><span>Family adults</span></div>
        <div class="kpi"><b>${R.reduce((t, r) => t + (r.kids || []).length, 0)}</b><span>Kids (${R.flatMap(r => r.kids || []).filter(a => a < 5).length} under 5)</span></div>
        <div class="kpi"><b>${n(r => r.callStatus === 'confirmed')}</b><span>Confirmed by call</span></div>
      </div>
      <h2 style="margin-top:16px;font-size:15px">Preferred month for the reunion</h2><p class="hint">From registrations and from the Reunion month poll on the Polls tab.</p>
      <div class="row mt">${(() => { const c = (S.monthPoll || {}).counts || {}; const e = Object.entries(c).sort((a, b) => b[1] - a[1]); return e.length ? e.map(([w, v], i) => `<span class="pill ${i ? 'b' : 'g'}">${esc(whenNm(w))}: ${v}</span>`).join('') : '<span class="hint">No preferences yet</span>'; })()}</div>
      <div class="row mt">${Object.entries(pick).map(([k, v]) => `<span class="pill b">${esc(k)}: ${v}</span>`).join('')}</div>
    </section>
    <section class="card"><h2>Elections</h2><p class="hint">Current leader in each.</p>
      <div class="tw"><table><tr><th>Election</th><th>Leader</th><th>Votes</th></tr>
      ${S.elections.map(e => `<tr><td>${esc(e.title)} <span class="pill ${e.status === 'live' ? 'g' : e.status === 'closed' ? '' : 'o'}">${e.status}</span>${e.mode === 'scripted' ? '<span class="pill">scripted</span>' : ''}</td><td>${e.total ? esc(e.candidates[0].name) : '—'}</td><td>${e.total}</td></tr>`).join('')}
      </table></div>
    </section>
    <section class="card"><h2>Scripted results clock</h2><p class="hint">Moves every scripted election (Women's Coordinator, venue) once per interval. Live elections are not affected.</p>
      <div class="f2">
        <div><label>Status</label><label class="check" style="height:40px"><input type="checkbox" id="aOn" ${a.on ? 'checked' : ''}> Running</label></div>
        <div><label for="aInt">Update every (minutes)</label><input type="number" id="aInt" min="1" value="${a.intervalMin}"></div>
      </div>
      <p class="hint mt" style="margin-bottom:0">Last update: <b>${when(S.updatedAt)}</b><br>Next update: <b>${a.on ? when(S.nextUpdateAt) : 'paused'}</b></p>
      <div class="row mt"><button class="btn p" data-a="saveAuto">Save</button><button class="btn" data-a="step">Run next update now</button><button class="btn r" data-a="restart">Restart story</button></div>
    </section>
  </div>`;
}

// ------------------------------------------------------------ elections
function elections() {
  const e = S.elections.find(x => x.id === selE);
  const pend = S.elections.flatMap(x => x.candidates.filter(c => c.videoInfo && c.videoInfo.status === 'pending').map(c => ({ e: x, c })));
  return `${pend.length ? `<section class="card" style="margin-bottom:16px;border-color:#F5C79C"><h2>Campaign videos waiting for approval (${pend.length})</h2>
    ${pend.map(({ e: x, c }) => `<div class="row" style="padding:8px 0;border-top:1px solid #EEF0F4"><b>${esc(c.name)}</b><span class="sub">${esc(x.title)}</span><a href="${esc(c.videoInfo.url)}" target="_blank" rel="noopener" style="color:var(--blue)">Watch ↗</a><button class="btn s p" data-vapprove2="${x.id}|${c.id}">Approve</button><button class="btn s r" data-vremove2="${x.id}|${c.id}">Reject</button></div>`).join('')}</section>` : ''}
  <section class="card" style="margin-bottom:16px"><div class="hrow"><h2>Reunion month poll</h2><span class="pill ${S.monthPoll && S.monthPoll.open ? 'g' : ''}">${S.monthPoll && S.monthPoll.open ? 'open' : 'closed'}</span></div>
    <form id="mForm" class="f2 mt"><div><label>Month voting closes</label>${closeSel('monthCloseIn', S.monthPoll && S.monthPoll.closesAt)}</div><div><label>&nbsp;</label><button class="btn p">Save</button></div></form></section>
  <div class="split">
    <section class="card elist" style="padding:8px">
      ${S.elections.map(x => `<button data-sel="${x.id}" class="${x.id === selE ? 'on' : ''}"><b>${esc(x.title)}</b><small><span class="pill ${x.status === 'live' ? 'g' : x.status === 'closed' ? '' : 'o'}">${x.status}</span> ${x.candidates.length} candidates · ${x.total} votes · ${x.mode}</small></button>`).join('')}
      <form id="newE" style="padding:12px;border-top:1px solid #EEF0F4;margin-top:6px"><label>New election</label><input type="text" name="title" placeholder="e.g. Cultural Programme" required><div class="row mt"><button class="btn d s">Add election</button></div></form>
    </section>
    ${e ? electionEditor(e) : '<section class="card">Select an election.</section>'}
  </div>`;
}
function electionEditor(e) {
  const sc = e.mode === 'scripted';
  return `<div style="display:flex;flex-direction:column;gap:16px">
  <section class="card">
    <div class="hrow"><h2>${esc(e.title)}</h2><div class="row"><button class="btn s" data-a="up">↑</button><button class="btn s" data-a="down">↓</button></div></div>
    <form id="eForm" class="mt">
      <div class="f2"><div><label>Title</label><input type="text" name="title" value="${esc(e.title)}"></div>
      <div><label>How results are counted</label><select name="mode"><option value="live" ${!sc ? 'selected' : ''}>Live: real votes only</option><option value="scripted" ${sc ? 'selected' : ''}>Scripted: numbers follow the script</option></select></div></div>
      <div class="f2 mt"><div><label>Status</label><select name="status"><option value="upcoming" ${e.status === 'upcoming' ? 'selected' : ''}>Upcoming (not on Home, no voting yet)</option><option value="live" ${e.status === 'live' ? 'selected' : ''}>Live (shown on Home, voting open)</option><option value="closed" ${e.status === 'closed' ? 'selected' : ''}>Closed (results only)</option></select></div>
      <div><label>Poll closes</label>${closeSel('closeIn', e.closesAt)}</div></div>
      <div class="f2 mt"><div></div><div><label>&nbsp;</label><div class="row">${e.status !== 'live' ? `<button type="button" class="btn p" data-a="startE">Start voting now</button>` : `<button type="button" class="btn r" data-a="closeE">Close voting</button>`}</div></div></div>
      ${e.kind === 'role' ? `<div class="mt"><label>Confirmed people on this team (Teams tab) · one name per line</label><textarea name="team" placeholder="e.g.
Srinivas Rao
Kiran Kumar">${esc((e.team || []).join('\n'))}</textarea></div>` : ''}
      <div class="mt"><label>Description shown to voters</label><textarea name="desc">${esc(e.desc)}</textarea></div>
      <div class="f2 mt"><div><label>Confirmed coordinator (highlighted in the app, closes voting)</label><select name="confirmedId"><option value="">Not confirmed yet</option>${e.candidates.map(c => `<option value="${c.id}" ${c.id === e.confirmedId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>Nominations</label><label class="check" style="height:40px"><input type="checkbox" name="openNominations" ${e.openNominationsSetting ? 'checked' : ''}> Anyone can add nominees from the app</label></div></div>
      ${sc ? `<div class="f3 mt">
        <div><label>Always ends on top</label><select name="favoriteId"><option value="">Nobody (natural spread)</option>${e.candidates.map(c => `<option value="${c.id}" ${c.id === e.favoriteId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>Target total votes</label><input type="number" name="cap" value="${e.cap}"></div>
        <div><label>Favourite dips to 2nd every … updates (0 = never)</label><input type="number" name="dipEvery" value="${e.dipEvery}"></div>
        <div><label>New votes per update (min)</label><input type="number" name="rateMin" value="${e.rateMin}"></div>
        <div><label>New votes per update (max)</label><input type="number" name="rateMax" value="${e.rateMax}"></div>
        <div><label>Votes at the start</label><input type="number" name="startTotal" value="${e.startTotal}"></div>
        <div><label>After reaching the target</label><select name="afterCap"><option value="shuffle" ${e.afterCap === 'shuffle' ? 'selected' : ''}>Keep shifting</option><option value="hold" ${e.afterCap === 'hold' ? 'selected' : ''}>Freeze</option></select></div>
      </div>
      <p class="hint mt">Changing script settings recalculates the whole history, so public numbers can jump.</p>` : '<p class="hint mt">Every vote from the app counts. Manual ± below adds on top.</p>'}
      <div class="row mt"><button class="btn p">Save election</button><button type="button" class="btn r" data-a="resetVotes">Reset votes</button><button type="button" class="btn r" data-a="delE">Delete election</button></div>
    </form>
  </section>
  <section class="card"><h2>Candidates</h2><p class="hint">${e.realVoters} real voter${e.realVoters === 1 ? '' : 's'} so far. Shown total = ${sc ? 'script' : 'real votes'} + manual change.</p>

// ------------------------------------------------------------ chat
let statWho = 'all';
function chatStatsCard(st) {
  if (!st) return '';
  const days = []; for (let d = new Date(st.start + 'T00:00:00Z'); d.toISOString().slice(0, 10) <= st.today; d.setUTCDate(d.getUTCDate() + 1)) days.push(d.toISOString().slice(0, 10));
  const P = st.people, who = P.find(p => p.id === statWho);
  const per = k => who ? (who.days[k] || 0) : P.reduce((a, p) => a + (p.days[k] || 0), 0);
  const vals = days.map(per), total = vals.reduce((a, b) => a + b, 0), max = Math.max(1, ...vals);
  const active = vals.filter(v => v).length, bi = vals.indexOf(Math.max(...vals));
  const fmt = k => new Date(k + 'T00:00:00Z').toLocaleDateString('en-IN', { day:'numeric', month:'short', timeZone:'UTC' });
  const W = Math.max(640, days.length * 34), H = 220, pl = 34, pb = 34, pt = 18, bw = (W - pl - 10) / days.length;
  const ticks = [0, Math.ceil(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  const step = Math.ceil(days.length / 14);
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Messages sent per day" style="display:block;font-family:inherit">
    ${ticks.map(t => { const y = pt + (H - pt - pb) * (1 - t / max); return `<line x1="${pl}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="#EEF0F4"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6B7280">${t}</text>`; }).join('')}
    ${vals.map((v, i) => { const h = (H - pt - pb) * v / max, x = pl + i * bw + bw * .18, y = H - pb - h, w = bw * .64;
      return `<g><title>${fmt(days[i])}: ${v} message${v === 1 ? '' : 's'}</title>${v ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${i === bi ? '#0D9488' : '#5EBFB3'}"/><text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">${v}</text>` : `<rect x="${x}" y="${H - pb - 2}" width="${w}" height="2" fill="#E5E7EB"/>`}
        ${i % step === 0 || i === days.length - 1 ? `<text x="${x + w / 2}" y="${H - pb + 16}" text-anchor="middle" font-size="11" fill="#6B7280">${fmt(days[i])}</text>` : ''}</g>`; }).join('')}
  </svg>`;
  const last7 = p => days.slice(-7).reduce((a, k) => a + (p.days[k] || 0), 0);
  return `<section class="card"><div class="hrow"><h2>Messages per day</h2>
      <select data-cstat style="width:240px"><option value="all">Everyone (${P.reduce((a, p) => a + p.total, 0)} messages)</option>${P.map(p => `<option value="${esc(p.id)}" ${p.id === statWho ? 'selected' : ''}>${esc(p.name)} (${p.total})</option>`).join('')}</select></div>

}
function chat() {
  const C = S.chat, P = Object.fromEntries(C.plans.map(p => [p.id, p]));
  const pend = C.users.filter(u => u.requested && u.status !== 'revoked');
  const subs = C.users.filter(u => u.status === 'active' || u.status === 'revoked');
  const ST = { none:'No plan', pending:'Requested', active:'Active', declined:'Declined', revoked:'Removed' };
  const planSel = (u, def) => `<select data-cplan="${u.id}" style="width:150px">${C.plans.map(p => `<option value="${p.id}" ${p.id === def ? 'selected' : ''}>${esc(p.name)} · ₹${p.price}</option>`).join('')}</select>`;
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr)">
  ${chatStatsCard(C.stats)}
  <section class="card"><h2>Chat members (${C.users.length})</h2><p class="hint">Everyone who accepted the chat rules.</p>
    <div class="tw"><table><tr><th>Name</th><th>Status</th><th>Messages sent</th><th></th></tr>
    ${C.users.map(u => `<tr><td><b>${esc(u.name)}</b></td><td><span class="pill ${u.status === 'revoked' ? 'r' : 'g'}">${u.status === 'revoked' ? 'Removed' : 'Active'}</span></td>
      <td>${u.used || 0}</td>
      <td><div class="row"><button class="btn s" data-cwarn="${u.id}">Message</button>${u.status !== 'revoked' ? `<button class="btn r s" data-crevoke="${u.id}">Remove access</button>` : `<button class="btn s" data-crestore="${u.id}">Restore access</button>`}</div></td></tr>`).join('') || '<tr><td colspan="6" class="hint">Nobody has joined chat yet.</td></tr>'}
    </table></div>
  </section>
  <section class="card"><h2>Messages (latest ${C.messages.length})</h2><p class="hint">Every message is delivered. You can delete any message here.</p>
    ${C.messages.map(m => `<div class="rs" style="grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) auto"><div><b>${esc(m.fromName)}</b> → ${esc(m.toName)}<div class="sub">${when(m.t)}</div></div><div style="white-space:pre-wrap">${esc(m.text)}</div><div><button class="btn r s" data-cdel="${m.id}">Delete</button></div></div>`).join('') || '<p class="hint">No messages yet.</p>'}
  </section></div>`;
}

// ------------------------------------------------------------ actions
const E = () => S.elections.find(x => x.id === selE);
const actions = {
  saveAuto: async () => { await api('/auto', { method:'PUT', json:{ on:$('aOn').checked, intervalMin:+$('aInt').value } }); toast('Saved'); },
  step: async () => { await api('/auto/step', { method:'POST' }); toast('Moved to the next update'); },
  restart: async () => { if (!confirm('Restart the scripted story from now? Scripted numbers go back to their starting values.')) return false; await api('/auto/restart', { method:'POST' }); toast('Restarted'); },
  startE: async () => { await api(`/elections/${selE}`, { method:'PUT', json:{ status:'live' } }); toast('Voting started. It now shows on Home.'); },
  closeE: async () => { await api(`/elections/${selE}`, { method:'PUT', json:{ status:'closed' } }); toast('Voting closed'); },
  addTest: async () => {
    if (!confirm('Add 54 test registrations? They are marked "Test", have no phone numbers, and replace the extra counts in Settings so Home shows 54.')) return false;
    const r = await api('/rsvps/test', { method:'POST', json:{ count:54 } }); toast(`${r.added} test registrations added`);
  },
  delTest: async () => {
    if (!confirm('Delete all test registrations? Real registrations are not affected.')) return false;
    const r = await api('/rsvps/test', { method:'DELETE' }); toast(`${r.removed} test registrations deleted`);
  },
  up: async () => { await api(`/elections/${selE}`, { method:'PUT', json:{ move:'up' } }); },
  down: async () => { await api(`/elections/${selE}`, { method:'PUT', json:{ move:'down' } }); },
  resetVotes: async () => { if (!confirm(`Reset all votes in "${E().title}"? Real votes and manual changes are removed.`)) return false; await api(`/elections/${selE}/reset-votes`, { method:'POST' }); toast('Votes reset'); },
  delE: async () => { if (!confirm(`Delete the election "${E().title}" and its tasks?`)) return false; await api(`/elections/${selE}`, { method:'DELETE' }); selE = null; toast('Deleted'); },
  sadd: async () => { sched.push({ day:1, time:'', title:'', note:'', tag:'' }); render(); return false; },
  ssave: async () => { await api('/schedule', { method:'PUT', json:{ items:sched } }); sched = null; toast('Schedule saved'); },
  csv: async () => {
    const cols = ['name','email','pass','gender','branch','phone','city','attend','overnight','pickup','when','food','family','spouse','kids','others','headcount','callStatus','note','source','createdAt'];
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [cols.join(',')].concat(S.rsvps.map(r => cols.map(c => cell(c === 'createdAt' ? new Date(r[c]).toISOString() : c === 'kids' ? (r.kids || []).join(' ') : c === 'when' ? (r.when ? whenNm(r.when) : '') : r[c])).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\n')], { type:'text/csv' }));
    a.download = 'reunion-registrations.csv'; a.click();
    return false;
  }
};

document.addEventListener('click', run(async e => {
  const sp = e.target.closest('[data-cstatpick]'); if (sp) { statWho = sp.dataset.cstatpick; render(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const t = e.target;
  const a = t.closest('[data-a]'); if (a) { e.preventDefault(); if ((await actions[a.dataset.a]()) !== false) await load(); return; }
  const s = t.closest('[data-sel]'); if (s) { selE = s.dataset.sel; render(); return; }
  const adj = t.closest('[data-adj]'); if (adj) { const [cid, d] = adj.dataset.adj.split('|'); await api(`/elections/${selE}/candidates/${cid}`, { method:'PUT', json:{ delta:+d } }); return load(); }
  const clr = t.closest('[data-clr]'); if (clr) { await api(`/elections/${selE}/candidates/${clr.dataset.clr}`, { method:'PUT', json:{ clear:true } }); return load(); }
  const hd = t.closest('[data-hide]'); if (hd) { const [id, h] = hd.dataset.hide.split('|'); await api(`/accounts/${id}/hidden`, { method:'POST', json:{ hidden: h === '1' } }); toast(h === '1' ? 'Hidden — nobody in the app sees this name' : 'Visible again'); return load(); }
  const ub = t.closest('[data-block]'); if (ub) { const [id, h] = ub.dataset.block.split('|'); await api(`/accounts/${id}/block`, { method:'POST', json:{ hours:+h } }); toast('Unblocked'); return load(); }
  const da = t.closest('[data-delacc]'); if (da) { const [id, email, reg] = da.dataset.delacc.split('|');
    if (!confirm(`Delete the account ${email}?\n\nThis removes their sign-in, chat messages, activity and any votes they cast. It cannot be undone. If they sign in again they will need your approval.`)) return;
    const alsoRsvp = reg === '1' && confirm('Also delete their registration (RSVP)?\n\nOK = delete the registration too\nCancel = keep the registration');
    await api(`/accounts/${id}${alsoRsvp ? '?rsvp=1' : ''}`, { method:'DELETE' }); toast('Account deleted'); return load(); }
  const ap = t.closest('[data-appr]'); if (ap) { const [id, action] = ap.dataset.appr.split('|'); await api(`/accounts/${id}/approval`, { method:'POST', json:{ action } }); toast(action === 'approved' ? 'Approved — they can now use the app' : 'Declined'); return load(); }
  const dp = t.closest('[data-delphoto]'); if (dp) { if (!confirm('Remove this photo from the album?')) return; await api(`/album/${dp.dataset.delphoto}`, { method:'DELETE' }); toast('Photo removed'); return load(); }
  const dc = t.closest('[data-delc]'); if (dc) { if (!confirm('Remove this candidate and their votes?')) return; await api(`/elections/${selE}/candidates/${dc.dataset.delc}`, { method:'DELETE' }); return load(); }
  const dr = t.closest('[data-delr]'); if (dr) { if (!confirm('Delete this registration?')) return; await api(`/rsvps/${dr.dataset.delr}`, { method:'DELETE' }); return load(); }
  const sd = t.closest('[data-sdel]'); if (sd) { sched.splice(+sd.dataset.sdel, 1); render(); return; }
  const ca = t.closest('[data-capprove]');
  if (ca) { const sel = ca.closest('tr') && ca.closest('tr').querySelector('select'); await api(`/chat/${ca.dataset.capprove}`, { method:'POST', json:{ action:'approve', plan: sel ? sel.value : undefined } }); toast('Plan activated'); return load(); }
  const cd = t.closest('[data-cdecline]'); if (cd) { await api(`/chat/${cd.dataset.cdecline}`, { method:'POST', json:{ action:'decline' } }); toast('Request declined'); return load(); }
  const cr = t.closest('[data-crevoke]'); if (cr) { if (!confirm('Remove this person\'s chat access?')) return; await api(`/chat/${cr.dataset.crevoke}`, { method:'POST', json:{ action:'revoke' } }); toast('Access removed'); return load(); }
  const vl = t.closest('[data-vlike]'); if (vl) { const [cid, d] = vl.dataset.vlike.split('|'); await api(`/elections/${selE}/candidates/${cid}/video`, { method:'POST', json:{ action:'likes', delta:+d } }); toast(`${+d > 0 ? '+' : ''}${d} likes`); return load(); }
  const va = t.closest('[data-vapprove]'); if (va) { await api(`/elections/${selE}/candidates/${va.dataset.vapprove}/video`, { method:'POST', json:{ action:'approve' } }); toast('Video approved'); return load(); }
  const vr = t.closest('[data-vremove]'); if (vr) { await api(`/elections/${selE}/candidates/${vr.dataset.vremove}/video`, { method:'POST', json:{ action:'remove' } }); toast('Video removed'); return load(); }
  const va2 = t.closest('[data-vapprove2]'); if (va2) { const [x, c] = va2.dataset.vapprove2.split('|'); await api(`/elections/${x}/candidates/${c}/video`, { method:'POST', json:{ action:'approve' } }); toast('Video approved'); return load(); }
  const vr2 = t.closest('[data-vremove2]'); if (vr2) { const [x, c] = vr2.dataset.vremove2.split('|'); await api(`/elections/${x}/candidates/${c}/video`, { method:'POST', json:{ action:'remove' } }); toast('Video rejected'); return load(); }
  const cre = t.closest('[data-crestore]'); if (cre) { await api(`/chat/${cre.dataset.crestore}`, { method:'POST', json:{ action:'restore' } }); toast('Access restored'); return load(); }
  const cw = t.closest('[data-cwarn]');
  if (cw) {
    const text = prompt('Message from the Organising Committee:', 'Please stop asking batchmates for phone numbers or personal details in chat. Keep messages respectful and professional, or your chat access will be removed.');
    if (!text) return;
    await api(`/chat/${cw.dataset.cwarn}/message`, { method:'POST', json:{ text } }); toast('Message sent'); return load();
  }
  const cm = t.closest('[data-cdel]'); if (cm) { if (!confirm('Delete this message?')) return; await api(`/chat/messages/${cm.dataset.cdel}`, { method:'DELETE' }); toast('Message deleted'); return load(); }
  const td = t.closest('[data-tdel]'); if (td) { await api(`/tasks/${td.dataset.tdel}`, { method:'DELETE' }); return load(); }
}));

document.addEventListener('change', run(async e => {
  if (e.target.dataset && e.target.dataset.cstat !== undefined) { statWho = e.target.value; render(); return; }
  if (e.target.dataset && e.target.dataset.blockSel && e.target.value) { const h = +e.target.value, label = e.target.selectedOptions[0].textContent;
    if (!confirm(`Block this account for ${label.toLowerCase()}?\n\nThey will see "Access paused" and can't use the app until then.`)) { e.target.value = ''; return; }
    await api(`/accounts/${e.target.dataset.blockSel}/block`, { method:'POST', json:{ hours:h } }); toast(`Blocked for ${label.toLowerCase()}`); return load(); }
  if (e.target.dataset && e.target.dataset.vfile && e.target.files[0]) {
    const f = e.target.files[0], cid = e.target.dataset.vfile;
    if (f.size > 400 * 1048576) return toast('File is too big (max 400 MB)');
    const x = new XMLHttpRequest(); x.open('POST', `/api/admin/elections/${selE}/candidates/${cid}/videofile`);
    x.setRequestHeader('x-admin-password', PW); x.setRequestHeader('Content-Type', f.type || 'video/mp4');
    x.upload.onprogress = ev => { if (ev.lengthComputable) toast(`Uploading video… ${Math.round(ev.loaded / ev.total * 100)}%`); };
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {} if (x.status >= 400) return toast(d.error || 'Upload failed'); toast('Uploaded. Preparing the video — it goes live in a few minutes.'); load(); };
    x.onerror = () => toast('Upload failed. Check your connection and try again.');
    x.send(f); return;
  }
  const t = e.target;
  if (t.dataset.cphoto) { await api(`/elections/${selE}/candidates/${t.dataset.cphoto}`, { method:'PUT', json:{ photo:t.value.trim(), credit: t.value.trim() ? 'Photo added by admin' : '' } }); toast('Photo saved'); return load(); }
  if (t.dataset.cname) { await api(`/elections/${selE}/candidates/${t.dataset.cname}`, { method:'PUT', json:{ name:t.value } }); toast('Name saved'); return load(); }
  if (t.dataset.cnote !== undefined && t.dataset.cnote) { await api(`/elections/${selE}/candidates/${t.dataset.cnote}`, { method:'PUT', json:{ note:t.value } }); toast('Note saved'); return; }
  if (t.dataset.rpass) { await api(`/rsvps/${t.dataset.rpass}`, { method:'PUT', json:{ pass:t.value } }); toast('Pass updated'); return load(); }
  if (t.dataset.rstat) { await api(`/rsvps/${t.dataset.rstat}`, { method:'PUT', json:{ callStatus:t.value } }); toast('Status saved'); return load(); }
  if (t.dataset.rnote) { await api(`/rsvps/${t.dataset.rnote}`, { method:'PUT', json:{ note:t.value } }); toast('Note saved'); return; }
  if (t.dataset.tstat) { await api(`/tasks/${t.dataset.tstat}`, { method:'PUT', json:{ status:t.value } }); return load(); }
  if (t.dataset.s) { const [i, k] = t.dataset.s.split('|'); sched[+i][k] = k === 'day' ? +t.value : t.value; return; }
  if (t.id === 'qs') { qStatus = t.value; render(); }
  if (t.id === 'qp') { qPass = t.value; render(); }
}));
document.addEventListener('keydown', run(async e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.vset) {
    e.preventDefault();
    await api(`/elections/${selE}/candidates/${e.target.dataset.vset}/video`, { method:'POST', json:{ action:'set', url:e.target.value } }); toast('Video added'); return load();

document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); } });

document.addEventListener('submit', run(async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  if (f.id === 'bcast') {
    const o = f.elements.to.selectedOptions[0].text;
    if (!confirm(`Send this message to: ${o}?`)) return false;
    const r = await api('/broadcast', { method:'POST', json:d }); toast(`Sent to ${r.sent} ${r.sent === 1 ? 'person' : 'people'}`); return;
  }
  if (f.id === 'newE') { const r = await api('/elections', { method:'POST', json:d }); selE = r.id; toast('Election added'); }
  else if (f.id === 'eForm') {
    for (const k of ['cap','dipEvery','rateMin','rateMax','startTotal']) if (k in d) d[k] = +d[k];
    d.openNominations = !!d.openNominations;
    if ('team' in d) d.team = d.team.split('\n').map(x => x.trim()).filter(Boolean);
    await api(`/elections/${selE}`, { method:'PUT', json:d }); toast('Election saved');
  }
  else if (f.id === 'mForm') { await api('/settings', { method:'PUT', json:d }); toast('Saved'); }
  else if (f.id === 'newC') { await api(`/elections/${selE}/candidates`, { method:'POST', json:d }); toast('Candidate added'); }
  else if (f.id === 'newR') { d.overnight = d.overnight === 'true'; await api('/rsvps', { method:'POST', json:d }); toast('Registration added'); }
  else if (f.id === 'newT') { await api('/tasks', { method:'POST', json:d }); toast('Task added'); }
  else if (f.id === 'sForm') {
    const ids = S.settings.passes.map(p => p.id);
    d.passes = ids.map(id => ({ id, name:d[`pass_${id}_name`], tagline:d[`pass_${id}_tagline`], price:d[`pass_${id}_price`], benefits:String(d[`pass_${id}_benefits`] || '').split('\n').map(x => x.trim()).filter(Boolean) }));
    d.passBase = Object.fromEntries(ids.map(id => [id, +d[`pass_${id}_base`]]));
    for (const k of Object.keys(d)) if (k.startsWith('pass_')) delete d[k];
    d.requireApproval = !!d.requireApproval;
    d.whatsapp = { show: !!d.wa_show, active: +d.wa_active, left: +d.wa_left, admins: +d.wa_admins,
      locations: String(d.wa_locations || '').split('\n').map(x => x.split(':')).filter(x => x[0] && x[0].trim()).map(([pl, c]) => ({ place: pl.trim(), count: +(c || 0) })) };
    for (const k of Object.keys(d)) if (k.startsWith('wa_')) delete d[k];
    const json = { ...d, expected:+d.expected, regBaseMale:+d.regBaseMale, regBaseFemale:+d.regBaseFemale, votingOpen:!!d.votingOpen, rsvpOpen:!!d.rsvpOpen,
      branches:d.branches.split(',').map(x => x.trim()).filter(Boolean), pickupPoints:d.pickupPoints.split(',').map(x => x.trim()).filter(Boolean) };
    await api('/settings', { method:'PUT', json }); toast('Settings saved');
  }
  await load();
}));

if (PW) api('/login', { method:'POST' }).then(start).catch(() => {});
</script>
