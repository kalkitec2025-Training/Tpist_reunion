<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Silver Jubilee Reunion: register, vote for the organising teams and see the schedule.">
<title>Silver Jubilee Reunion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C2410C'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3E25%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F7FB; --card:#fff; --ink:#12131A; --muted:#5B6070; --line:#E6E8F0; --accent:#C2410C; --accent-soft:#FFF4EC; --track:#EEF0F5; --ok:#1F7A4D; --ok-soft:#E5F5EC; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  .d { font-family:'Space Grotesk', Inter, sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  a { color:inherit; }
  .shell { max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }

  .top { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .mark { width:34px; height:34px; border-radius:10px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; }
  .brand b { display:block; font-size:16px; line-height:1.1; } .brand small { display:block; font-size:11px; color:var(--muted); margin-top:1px; }
  .live { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ok); font-weight:600; }
  .live i { width:7px; height:7px; border-radius:50%; background:var(--ok); animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(31,122,77,.45)} 70%{box-shadow:0 0 0 7px rgba(31,122,77,0)} 100%{box-shadow:0 0 0 0 rgba(31,122,77,0)} }

  .ticker { background:var(--ink); color:#D7DAE4; padding:9px 20px; font-size:12px; display:flex; gap:10px; align-items:center; white-space:nowrap; overflow:hidden; }
  .ticker b { background:var(--accent); color:#fff; font-size:10px; letter-spacing:.08em; padding:3px 7px; border-radius:4px; flex-shrink:0; }
  .ticker span { overflow:hidden; text-overflow:ellipsis; }

  .pad { padding:20px 20px 0; }
  .h1 { margin:0; font-size:28px; line-height:1.15; font-weight:700; }
  .sub { margin:6px 0 0; color:var(--muted); font-size:14px; line-height:1.5; }
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:26px 20px 10px; }
  .sec h2 { margin:0; font-size:17px; font-weight:700; }
  .sec a { font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 20px 12px; }
  .note-bar { margin:14px 20px 0; background:#FFF8E1; border:1px solid #F5E1A4; color:#6B4E00; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; display:flex; gap:10px; }
  .note-bar svg { flex-shrink:0; margin-top:1px; }
  .note-bar.ok { background:var(--ok-soft); border-color:#BFE3CF; color:var(--ok); }

  .hero { margin:16px 20px 0; background:var(--ink); color:#fff; border-radius:20px; padding:22px 20px; position:relative; overflow:hidden; }
  .hero:after { content:''; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; border:28px solid rgba(194,65,12,.35); }
  .hero .k { font-size:11px; letter-spacing:.14em; font-weight:700; color:#FDBA8C; }
  .hero h1 { margin:10px 0 0; font-size:30px; line-height:1.1; position:relative; z-index:1; }
  .hero p { margin:8px 0 0; color:#C9CCD6; font-size:13px; line-height:1.5; position:relative; z-index:1; }
  .hero .rows { margin-top:16px; display:flex; flex-direction:column; gap:8px; position:relative; z-index:1; }
  .hero .row { display:flex; gap:10px; align-items:center; font-size:14px; }
  .hero .row svg { color:#FDBA8C; flex-shrink:0; }

  .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:12px 20px 0; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; }
  .stat .n { font-size:22px; font-weight:700; } .stat .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .fine { margin:8px 20px 0; font-size:12px; color:var(--muted); line-height:1.5; }

  .cta { display:flex; flex-direction:column; gap:10px; }
  .cta .t { font-weight:700; font-size:16px; } .cta .x { font-size:14px; color:var(--muted); line-height:1.5; }
  .btn { height:48px; border:0; border-radius:12px; background:var(--ink); color:#fff; font-weight:600; font-size:15px; cursor:pointer; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .btn.acc { background:var(--accent); } .btn.ghost { background:var(--track); color:var(--ink); }
  .btn.line { background:#fff; color:var(--ink); border:1.5px dashed #B9BECD; }
  .btn.sm { height:40px; font-size:14px; border-radius:10px; padding:0 14px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .progress { height:8px; background:var(--track); border-radius:99px; overflow:hidden; }
  .progress div { height:8px; background:var(--accent); border-radius:99px; transition:width .6s ease; }

  .ico { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; flex-shrink:0; }
  .ecard { display:block; text-decoration:none; padding:0; overflow:hidden; }
  .ecard .main { display:flex; gap:14px; padding:16px; }
  .ecard .t { font-weight:700; font-size:15px; }
  .ecard .x { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ecard .foot2 { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line); font-size:13px; background:#FBFBFD; }
  .ecard .who { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:8px; min-width:0; }
  .ecard .who b { color:var(--ink); font-weight:600; }
  .ecard.fixed { border-color:#9FD6B8; }
  .ecard.fixed .foot2 { background:var(--ok-soft); }
  .fixed-name { display:flex; align-items:center; gap:8px; color:var(--ok); font-weight:700; font-size:14px; }
  .fixed-name .tag { font-size:11px; font-weight:700; letter-spacing:.04em; background:var(--ok); color:#fff; border-radius:6px; padding:3px 7px; }
  .chip { font-size:12px; font-weight:600; padding:5px 10px; border-radius:99px; white-space:nowrap; flex-shrink:0; }
  .chip.go { background:var(--accent-soft); color:var(--accent); } .chip.ok { background:var(--ok-soft); color:var(--ok); } .chip.wait { background:var(--track); color:var(--muted); }
  .chev-r { color:#A3A8BA; flex-shrink:0; align-self:center; }

  .av { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; flex-shrink:0; }
  .av.sm { width:28px; height:28px; font-size:11px; }
  .cand { display:flex; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--line); }
  .cand:first-child { border-top:0; padding-top:2px; }
  .cand.win { background:var(--ok-soft); border-radius:12px; padding:12px; margin:0 -6px; border-top:0; }
  .cand .m { flex:1; min-width:0; }
  .cand .l1 { display:flex; justify-content:space-between; gap:8px; font-size:15px; }
  .cand .l1 span:first-child { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cand .l1 span:last-child { font-weight:700; }
  .cand .nt { font-size:12px; color:var(--muted); margin-top:1px; }
  .bar { height:7px; background:var(--track); border-radius:99px; margin-top:7px; overflow:hidden; }
  .bar div { height:7px; border-radius:99px; background:#A3A8BA; transition:width .7s ease; }
  .cand.lead .bar div { background:var(--accent); } .cand.win .bar div { background:var(--ok); }
  .cand .l3 { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:12px; color:var(--muted); gap:8px; }
  .up { color:var(--ok); font-weight:600; } .dn { color:#B42318; font-weight:600; }
  .vbtn { height:36px; padding:0 14px; border-radius:10px; border:0; background:var(--ink); color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  .vbtn.mine { background:var(--ok-soft); color:var(--ok); display:inline-flex; align-items:center; }
  .back { display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:600; color:var(--muted); text-decoration:none; padding:16px 20px 0; }
  .ehead { display:flex; gap:14px; align-items:flex-start; padding:10px 20px 0; }

  .nom { display:flex; flex-direction:column; gap:10px; }
  .nom input { width:100%; height:46px; border:1px solid #D5D8E2; border-radius:12px; padding:0 14px; font-size:16px; background:#fff; }
  .nom input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .nom .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--track); border-radius:12px; padding:4px; margin:16px 20px 0; }
  .seg button { height:40px; border:0; border-radius:9px; background:transparent; font-weight:600; font-size:14px; color:var(--muted); cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(18,19,26,.08); }
  .tl .it { display:grid; grid-template-columns:78px 1fr; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .tl .it:first-child { border-top:0; padding-top:0; }
  .tl .tm { font-size:13px; font-weight:700; color:var(--accent); padding-top:1px; }
  .tl .tt { font-weight:600; font-size:15px; } .tl .tn { font-size:13px; color:var(--muted); margin-top:2px; line-height:1.45; }

  details.team summary { list-style:none; cursor:pointer; }
  details.team summary::-webkit-details-marker { display:none; }
  .team .hd { display:flex; gap:12px; align-items:flex-start; }
  .team .t { font-weight:700; font-size:15px; } .team .c { font-size:13px; color:var(--muted); margin-top:3px; }
  .team .c.fx { color:var(--ok); font-weight:700; }
  .team .pr { display:flex; gap:10px; align-items:center; margin-top:12px; font-size:12px; color:var(--muted); }
  .team .pr .progress { flex:1; height:6px; } .team .pr .progress div { height:6px; background:var(--ok); }
  .team ul { margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  .team li { display:flex; gap:10px; align-items:center; font-size:14px; }
  .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; border:2px solid #B5BACB; }
  .dot.doing { border-color:#D97706; background:#FDE68A; } .dot.done { border-color:var(--ok); background:var(--ok); }
  .chev { transition:transform .2s; color:var(--muted); flex-shrink:0; margin-left:auto; } details[open] .chev { transform:rotate(180deg); }

  .form { display:flex; flex-direction:column; gap:16px; }
  .fl label, .fl .lb { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .fl input, .fl select { width:100%; height:48px; border:1px solid #D5D8E2; border-radius:12px; padding:0 14px; background:#fff; font-size:16px; }
  .fl input:focus, .fl select:focus { outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  .fl .hint { font-size:12px; color:var(--muted); margin-top:5px; }
  .pills { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pills button { height:46px; border-radius:12px; border:1px solid #D5D8E2; background:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  .pills button.on { border:2px solid var(--accent); background:var(--accent-soft); color:var(--accent); }
  .ok-card { background:var(--ok-soft); border:1px solid #BFE3CF; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:8px 12px; font-size:14px; margin-top:12px; }
  .kv div:nth-child(odd) { color:var(--muted); }

  .empty { text-align:center; color:var(--muted); padding:24px 12px; font-size:14px; line-height:1.5; }
  .foot { text-align:center; font-size:11px; color:#7A7F90; padding:28px 20px 8px; line-height:1.7; }

  nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(255,255,255,.97); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav.tabs .in { max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5, 1fr); }
  nav.tabs a { display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0 9px; font-size:11px; font-weight:600; color:#7A7F90; text-decoration:none; position:relative; }
  nav.tabs a.on { color:var(--accent); }
  nav.tabs a .badge { position:absolute; top:6px; left:calc(50% + 6px); background:var(--accent); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:grid; place-items:center; padding:0 4px; }

  dialog { border:0; border-radius:18px; padding:0; width:min(92vw, 400px); }
  dialog::backdrop { background:rgba(10,10,14,.55); }
  .dlg { padding:22px; } .dlg h3 { margin:0; font-size:19px; } .dlg p { margin:8px 0 18px; color:var(--muted); font-size:14px; line-height:1.5; }
  .dlg .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toast { position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(14px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:99px; font-size:14px; opacity:0; transition:all .25s; pointer-events:none; z-index:30; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .loading { padding:80px 20px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#home"><div class="mark d">25</div><div><b class="d" id="brandName">Silver Jubilee</b><small>Reunion · 25 years</small></div></a>
    <div class="live"><i></i><span id="liveTime">Live</span></div>
  </header>
  <main id="view"><div class="loading">Loading…</div></main>
</div>

<nav class="tabs" aria-label="Main"><div class="in">
  <a href="#home" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#vote" data-tab="vote"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Vote<span class="badge" id="voteBadge" hidden></span></a>
  <a href="#schedule" data-tab="schedule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Schedule</a>
  <a href="#teams" data-tab="teams"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.7"/></svg>Teams</a>
  <a href="#rsvp" data-tab="rsvp"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>RSVP</a>
</div></nav>

<dialog id="ask"><div class="dlg"><h3 id="askT"></h3><p id="askP"></p><div class="row"><button type="button" class="btn ghost" id="askNo">Cancel</button><button type="button" class="btn acc" id="askYes">Confirm vote</button></div></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time = t => new Date(t).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });
const first = n => String(n).split(' ')[0];
const pct = (v, t) => (t ? Math.round(v / t * 100) : 0);
const AV = [['#FDE7DC','#9A3412'],['#E3ECFD','#1E40AF'],['#E5F5EC','#166534'],['#F3E8FD','#6B21A8'],['#FFF3D6','#92400E'],['#DDF3F1','#115E59']];
const hsh = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
function avatar(name, sm) {
  const [bg, fg] = AV[hsh(name) % AV.length];
  const ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  return `<div class="av ${sm ? 'sm' : ''}" style="background:${bg};color:${fg}" aria-hidden="true">${esc(ini)}</div>`;
}
const svg = (p, s = 22, cls = '') => `<svg ${cls ? `class="${cls}"` : ''} width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const P = {
  pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chevR: '<path d="M9 6l6 6-6 6"/>', chevD: '<path d="M6 9l6 6 6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>'
};
const ICONS = {
  venue: P.pin,
  overall: '<path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/>',
  telecalling: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  food: '<path d="M3 2v7a3 3 0 0 0 6 0V2M6 2v20M18 2c-2 0-3 2-3 5v6h3v9"/>',
  hospitality: '<path d="M2 4v16M2 9h16a4 4 0 0 1 4 4v7M2 16h20"/><circle cx="7" cy="12.5" r="1.5"/>',
  transport: '<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M8 18v3M16 18v3"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>',
  media: '<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',
  arrangements: '<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
  finance: '<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/>',
  women: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.7"/>',
  _: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'
};
const TILE = { venue:0, overall:5, telecalling:1, food:0, hospitality:3, transport:1, media:3, arrangements:4, finance:2, women:3 };
function icon(e) {
  const [bg, fg] = AV[TILE[e.id] ?? hsh(e.id) % AV.length];
  return `<div class="ico" style="background:${bg};color:${fg}">${svg(ICONS[e.id] || ICONS._)}</div>`;
}

let S = null, day = 1, pending = null, form = null, nomOpen = null;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
async function load() { try { const r = await fetch('/api/state', { cache:'no-store' }); S = await r.json(); render(); } catch {} }
const route = () => { const [r, a] = (location.hash.slice(1) || 'home').split('/'); return [r === 'plan' ? 'schedule' : r, a]; };
const votable = () => S.elections.filter(e => e.candidates.length && !e.confirmed);

function ticker() {
  const items = [];
  for (const e of S.elections) {
    if (!e.hasHistory || e.confirmed) continue;
    const top = [...e.candidates].sort((a, b) => b.lastHour - a.lastHour)[0];
    if (top && top.lastHour > 0) items.push(`${esc(e.kind === 'venue' ? 'Venue' : e.title.replace(/ Coordinator$/, ''))}: ${esc(e.kind === 'venue' ? top.name : first(top.name))} +${top.lastHour}`);
  }
  return items.length ? `<div class="ticker"><b>LAST HOUR</b><span>${items.join(' · ')}</span></div>` : '';
}
const anyoneNote = () => `<div class="note-bar">${svg(P.info, 18)}<span>Anyone in the batch can vote. Only batchmates who <a href="#rsvp" style="font-weight:700">register</a> are counted as attending.</span></div>`;
const footer = () => `<div class="foot">Reunion Organising Committee<br>Anyone can vote · Registered batchmates are counted as attending</div>`;

function render() {
  if (!S) return;
  const st = S.settings, [r, arg] = route();
  document.title = st.eventTitle;
  $('brandName').textContent = st.eventTitle;
  $('liveTime').textContent = `Live · ${time(S.updatedAt)}`;
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === r));
  const left = st.votingOpen ? votable().filter(e => !e.myVote).length : 0;
  $('voteBadge').hidden = !left; $('voteBadge').textContent = left;
  $('view').innerHTML = r === 'vote' && arg ? electionPage(arg) : r === 'vote' ? votePage() : r === 'schedule' ? schedulePage()
    : r === 'teams' ? teamsPage() : r === 'rsvp' ? rsvpPage() : homePage();
}

// ------------------------------------------------------------------ home
function resultRow(e, idx) {
  const l = e.candidates[0];
  let body;
  if (e.confirmed) body = `<div class="fixed-name" style="margin-top:8px">${avatar(e.confirmed.name, true)}${esc(e.confirmed.name)}<span class="tag">CONFIRMED</span></div>`;
  else if (!e.candidates.length) body = `<div style="margin-top:6px;font-size:13px;color:var(--muted)">Nominations open · add a name</div>`;
  else if (!e.total) body = `<div style="margin-top:6px;font-size:13px;color:var(--muted)">${e.candidates.length} nominee${e.candidates.length === 1 ? '' : 's'} · voting open</div>`;
  else body = `<div style="display:flex;align-items:center;gap:10px;margin-top:8px">${avatar(l.name, true)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(l.name)} leads</span><b>${pct(l.votes, e.total)}%</b></div><div class="bar"><div style="width:${pct(l.votes, e.total)}%;background:var(--accent)"></div></div></div></div>`;
  return `<a href="#vote/${esc(e.id)}" style="display:flex;gap:12px;padding:14px 0;${idx ? 'border-top:1px solid var(--line);' : ''}text-decoration:none">
    ${icon(e)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span style="font-weight:600">${esc(e.title)}</span><span style="color:var(--muted);white-space:nowrap">${e.total ? e.total + ' votes' : ''}</span></div>${body}</div></a>`;
}
function homePage() {
  const st = S.settings;
  const venue = S.elections.find(e => e.kind === 'venue');
  const vLead = venue && venue.confirmed ? venue.confirmed : venue && venue.total ? venue.candidates[0] : null;
  const roles = S.elections.filter(e => e.candidates.length);
  const voted = roles.filter(e => e.myVote || e.confirmed).length;
  const me = S.myRsvp;
  return `${ticker()}
  ${st.announcement ? `<div class="note-bar">${svg(P.info, 18)}<span>${esc(st.announcement)}</span></div>` : ''}
  <section class="hero">
    <div class="k">${esc(st.years)} YEARS · REUNION</div>
    <h1 class="d">${esc(st.eventTitle)}</h1>
    <p>Batchmates reuniting after ${esc(st.years)} years. Two days, one batch, a lifetime of stories.</p>
    <div class="rows">
      <div class="row">${svg(P.cal, 18)}<span>${esc(st.eventDate)}</span></div>
      <div class="row">${svg(P.pin, 18)}<span>Visakhapatnam · venue ${esc((st.venueStatus || 'not yet confirmed').toLowerCase())}</span></div>
    </div>
  </section>
  <div class="stats">
    <div class="stat"><div class="n d">${S.regShown.total}</div><div class="l">Registered</div></div>
    <div class="stat"><div class="n d">${S.regShown.male}</div><div class="l">Men</div></div>
    <div class="stat"><div class="n d">${S.regShown.female}</div><div class="l">Women</div></div>
  </div>
  <p class="fine">Registered batchmates are counted as attending. Anyone in the batch can vote.</p>

  <a class="card ecard" href="#vote/venue" style="margin-top:12px"><div class="main" style="align-items:center">${venue ? icon(venue) : ''}
    <div style="flex:1;min-width:0"><div class="t">Venue: ${esc(st.venueStatus || 'Not yet confirmed')}</div><div class="x">${vLead ? `${esc(vLead.name)} is leading the poll. ` : ''}The Overall Event Coordinator will confirm the final venue after voting closes.</div></div>${svg(P.chevR, 18, 'chev-r')}</div></a>

  <div class="sec"><h2 class="d">${me ? 'Your registration' : 'Are you coming?'}</h2></div>
  <div class="card cta ${me ? 'ok-card' : ''}">
    ${me ? `<div class="t">You're in, ${esc(first(me.name))}!</div>
      <div class="x">${me.attend === 'both' ? 'Both days' : 'Day 1 only'}${me.overnight ? ' · staying overnight' : ''} · ${me.pickup ? 'pickup from ' + esc(me.pickup) : 'own transport'} · ${me.food === 'veg' ? 'veg' : 'non-veg'}</div>
      <a class="btn ghost sm" href="#rsvp" style="align-self:flex-start">View or edit</a>`
    : `<div class="x">Register in a minute so the teams can plan food, stay and transport. Only registered batchmates are counted as attending.</div>
      <a class="btn acc" href="#rsvp">Register now</a>`}
  </div>

  <div class="sec"><h2 class="d">Your ballot</h2><a href="#vote">All elections</a></div>
  <div class="card cta">
    <div style="display:flex;justify-content:space-between;font-size:14px"><span style="font-weight:600">${voted} of ${roles.length} done</span><span style="color:var(--muted)">${roles.length - voted ? `${roles.length - voted} left` : 'All done'}</span></div>
    <div class="progress"><div style="width:${pct(voted, roles.length)}%"></div></div>
    ${roles.length - voted && st.votingOpen ? `<a class="btn" href="#vote">Continue voting</a>` : ''}
  </div>

  <div class="sec"><h2 class="d">Live results</h2><a href="#vote">Vote</a></div>
  <div class="card" style="padding:2px 16px">${S.elections.map(resultRow).join('')}</div>
  ${footer()}`;
}

// ------------------------------------------------------------------ vote
function votePage() {
  const st = S.settings;
  return `${ticker()}<div class="pad"><h1 class="h1 d">Elections</h1>
    <p class="sub">${st.votingOpen ? 'Choose the batchmates who will run each part of the reunion. One vote per election. Tap a card for full results.' : 'Voting has closed. Thank you for taking part.'}</p></div>
    ${anyoneNote()}<div style="height:14px"></div>
    ${S.elections.map(e => {
      const l = e.candidates[0];
      let foot;
      if (e.confirmed) foot = `<span class="fixed-name">${avatar(e.confirmed.name, true)}${esc(e.confirmed.name)}</span><span class="chip ok">✓ Confirmed</span>`;
      else {
        const who = !e.candidates.length ? 'No nominees yet · add one' : e.total ? `${avatar(l.name, true)}<span><b>${esc(l.name)}</b> leads · ${pct(l.votes, e.total)}%</span>` : `${e.candidates.length} nominee${e.candidates.length === 1 ? '' : 's'} · no votes yet`;
        const chip = !e.candidates.length ? '<span class="chip wait">Nominate</span>' : e.myVote ? '<span class="chip ok">Voted ✓</span>' : st.votingOpen ? '<span class="chip go">Vote now</span>' : '<span class="chip wait">Closed</span>';
        foot = `<span class="who">${who}</span>${chip}`;
      }
      return `<a class="card ecard ${e.confirmed ? 'fixed' : ''}" href="#vote/${esc(e.id)}">
        <div class="main">${icon(e)}<div style="flex:1;min-width:0"><div class="t">${esc(e.title)}</div><div class="x">${esc(e.desc)}</div></div>${svg(P.chevR, 18, 'chev-r')}</div>
        <div class="foot2">${foot}</div></a>`;
    }).join('')}
    ${footer()}`;
}

function electionPage(id) {
  const e = S.elections.find(x => x.id === id);
  if (!e) return `<a class="back" href="#vote">‹ Elections</a><div class="empty">This election is no longer available.</div>`;
  const canVote = S.settings.votingOpen && !e.myVote && !e.confirmed;
  const rows = e.candidates.map((c, i) => {
    const p = pct(c.votes, e.total);
    const win = e.confirmed && e.confirmed.id === c.id;
    const ch = c.lastHour > 0 ? `<span class="up">▲ ${c.lastHour} this hour</span>` : c.lastHour < 0 ? `<span class="dn">▼ ${-c.lastHour} this hour</span>` : '';
    const btn = win ? '<span class="chip ok">✓ Confirmed</span>' : e.myVote === c.id ? '<span class="vbtn mine">Your vote ✓</span>'
      : canVote ? `<button type="button" class="vbtn" data-vote="${esc(e.id)}|${esc(c.id)}">Vote</button>` : '';
    return `<div class="cand ${win ? 'win' : i === 0 && e.total ? 'lead' : ''}">${avatar(c.name)}<div class="m">
      <div class="l1"><span>${esc(c.name)}</span><span>${p}%</span></div>
      ${c.note ? `<div class="nt">${esc(c.note)}</div>` : ''}
      <div class="bar"><div style="width:${p}%"></div></div>
      <div class="l3"><span>${c.votes} vote${c.votes === 1 ? '' : 's'}${ch ? ' · ' + ch : ''}</span>${btn}</div>
    </div></div>`;
  }).join('');
  const nomForm = e.openNominations && S.settings.votingOpen ? (nomOpen === e.id
    ? `<form class="card nom" id="nomForm" data-e="${esc(e.id)}"><div style="font-weight:700">Add a nominee</div>
        <input name="name" placeholder="Batchmate's name" maxlength="40" required autocomplete="off" aria-label="Batchmate's name">
        <input name="note" placeholder="Branch · city (optional)" maxlength="60" autocomplete="off" aria-label="Branch and city">
        <div class="row2"><button type="button" class="btn ghost sm" data-nomclose>Cancel</button><button class="btn acc sm">Add nominee</button></div></form>`
    : `<div style="margin:0 20px 12px"><button type="button" class="btn line" style="width:100%" data-nom="${esc(e.id)}">${svg(P.plus, 18)}Add a nominee</button></div>`) : '';
  return `${ticker()}<a class="back" href="#vote">‹ Elections</a>
    <div class="ehead">${icon(e)}<div><h1 class="h1 d" style="font-size:24px">${esc(e.title)}</h1><p class="sub">${esc(e.desc)}</p></div></div>
    <p class="sub" style="font-size:13px;padding:10px 20px 0">${e.total} votes · ${e.live ? 'counted live' : 'updated ' + time(S.updatedAt)}</p>
    ${e.confirmed ? `<div class="note-bar ok">${svg(P.check, 18)}<span><b>${esc(e.confirmed.name)}</b> is confirmed as ${esc(e.title)}. Voting for this role is closed.</span></div>`
      : e.myVote ? `<div class="note-bar ok">${svg(P.check, 18)}<span>Thanks, your vote is counted.</span></div>` : ''}
    <div class="card" style="margin-top:16px">${rows || `<div class="empty">No nominees yet.<br>Add a batchmate below and ask everyone to vote.</div>`}</div>
    ${nomForm}
    ${footer()}`;
}

// ------------------------------------------------------------------ schedule
const tlItem = s => `<div class="it"><div class="tm">${esc(s.time)}</div><div><div class="tt">${esc(s.title)}</div>${s.note ? `<div class="tn">${esc(s.note)}</div>` : ''}</div></div>`;
function schedulePage() {
  const items = S.schedule.filter(s => s.day === day);
  return `<div class="pad"><h1 class="h1 d">Schedule</h1><p class="sub">${esc(S.settings.eventDate)}. Timings may change slightly.</p></div>
    <div class="seg" role="tablist"><button type="button" class="${day === 1 ? 'on' : ''}" data-day="1">Day 1</button><button type="button" class="${day === 2 ? 'on' : ''}" data-day="2">Day 2</button></div>
    <div class="card" style="margin-top:12px"><div class="tl">${items.map(tlItem).join('') || '<div class="empty">Schedule coming soon.</div>'}</div></div>
    ${footer()}`;
}

// ------------------------------------------------------------------ teams
function teamsPage() {
  const st = S.settings;
  const teams = S.elections.filter(e => e.kind === 'role');
  return `<div class="pad"><h1 class="h1 d">Organising teams</h1><p class="sub">Who runs what, and how each team is doing. Coordinators are chosen by vote.</p></div>
    <div style="height:14px"></div>
    ${teams.map(e => {
      const t = S.tasks[e.id] || { total:0, done:0, items:[] };
      const lead = e.candidates[0];
      const who = e.confirmed ? `<div class="c fx">✓ Coordinator: ${esc(e.confirmed.name)}</div>`
        : !e.candidates.length ? '<div class="c">Coordinator: nominations open</div>'
        : !e.total ? `<div class="c">${e.candidates.length} nominee${e.candidates.length === 1 ? '' : 's'} · voting open</div>`
        : `<div class="c">${st.votingOpen ? 'Leading' : 'Coordinator'}: ${esc(lead.name)}</div>`;
      const extra = e.id === 'overall' ? '<div class="c" style="color:var(--accent);font-weight:600">Final venue confirmation pending</div>' : '';
      return `<details class="card team"><summary>
        <div class="hd">${icon(e)}<div style="flex:1;min-width:0"><div class="t">${esc(e.title)}</div>${who}${extra}</div>${t.total ? svg(P.chevD, 18, 'chev') : ''}</div>
        ${t.total ? `<div class="pr"><div class="progress"><div style="width:${pct(t.done, t.total)}%"></div></div><span>${t.done}/${t.total} done</span></div>` : ''}
      </summary>
      ${t.total ? `<ul>${t.items.map(x => `<li><span class="dot ${x.status}"></span><span style="${x.status === 'done' ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(x.title)}</span>${x.status === 'doing' ? '<span class="chip wait" style="margin-left:auto">In progress</span>' : ''}</li>`).join('')}</ul>` : ''}
      <div style="margin-top:12px"><a class="btn ghost sm" href="#vote/${esc(e.id)}">${e.confirmed ? 'See results' : 'Vote or nominate'}</a></div>
      </details>`;
    }).join('')}
    ${footer()}`;
}

// ------------------------------------------------------------------ rsvp
function rsvpPage() {
  const st = S.settings, me = S.myRsvp;
  if (!form) form = me ? { ...me } : { name:'', gender:'', branch:'', phone:'', city:'', attend:'both', overnight:false, pickup:'', food:'nonveg', editing:false };
  if (me && !form.editing) {
    return `<div class="pad"><h1 class="h1 d">Your registration</h1><p class="sub">The Tele-calling team may call to confirm. Update anything here.</p></div>
    <div class="card ok-card" style="margin-top:16px">
      <div style="font-weight:700;font-size:16px">You're registered ✓</div>
      <div class="kv">
        <div>Name</div><div>${esc(me.name)}</div><div>Gender</div><div>${me.gender === 'female' ? 'Female' : me.gender === 'male' ? 'Male' : '—'}</div>
        <div>Branch</div><div>${esc(me.branch || '—')}</div><div>Mobile</div><div>${esc(me.phone)}</div><div>City</div><div>${esc(me.city || '—')}</div>
        <div>Attending</div><div>${me.attend === 'both' ? 'Both days' : 'Day 1 only'}</div><div>Overnight</div><div>${me.overnight ? 'Yes' : 'No'}</div>
        <div>Transport</div><div>${me.pickup ? 'Pickup from ' + esc(me.pickup) : 'Coming on my own'}</div><div>Food</div><div>${me.food === 'veg' ? 'Vegetarian' : 'Non-vegetarian'}</div>
      </div>
      <button type="button" class="btn ghost sm" style="margin-top:16px" data-edit>Edit details</button>
    </div>${footer()}`;
  }
  if (!st.rsvpOpen) return `<div class="pad"><h1 class="h1 d">Registration</h1></div><div class="card" style="margin-top:16px"><div class="empty">Registrations are closed. Please contact the Tele-calling team.</div></div>`;
  const pill = (k, v, label) => `<button type="button" class="${form[k] === v ? 'on' : ''}" data-set="${k}|${v}">${label}</button>`;
  return `<div class="pad"><h1 class="h1 d">${me ? 'Update details' : 'Register for the reunion'}</h1>
    <p class="sub">Takes a minute. Only registered batchmates are counted as attending, and the teams plan meals, rooms and pickups from this.</p></div>
    <form class="card form" id="rsvpForm" style="margin-top:16px" novalidate>
      <div class="fl"><label for="f-name">Full name</label><input id="f-name" name="name" autocomplete="name" value="${esc(form.name)}" required></div>
      <div class="fl"><div class="lb">Gender</div><div class="pills">${pill('gender', 'male', 'Male')}${pill('gender', 'female', 'Female')}</div></div>
      <div class="fl"><label for="f-branch">Branch</label><select id="f-branch" name="branch"><option value="">Select branch</option>${st.branches.map(b => `<option ${form.branch === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>
      <div class="fl"><label for="f-phone">Mobile number</label><input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" value="${esc(form.phone)}" required><div class="hint">Only the organising committee sees this.</div></div>
      <div class="fl"><label for="f-city">Current city</label><input id="f-city" name="city" autocomplete="address-level2" value="${esc(form.city)}"></div>
      <div class="fl"><div class="lb">Attending</div><div class="pills">${pill('attend', 'both', 'Both days')}${pill('attend', 'day1', 'Day 1 only')}</div></div>
      ${form.attend === 'both' ? `<div class="fl"><div class="lb">Staying overnight on Day 1?</div><div class="pills">${pill('overnight', true, 'Yes')}${pill('overnight', false, 'No')}</div></div>` : ''}
      <div class="fl"><label for="f-pickup">Transport</label><select id="f-pickup" name="pickup"><option value="">I'll come on my own</option>${st.pickupPoints.map(p => `<option value="${esc(p)}" ${form.pickup === p ? 'selected' : ''}>Pickup from ${esc(p)}</option>`).join('')}</select></div>
      <div class="fl"><div class="lb">Food preference</div><div class="pills">${pill('food', 'nonveg', 'Non-veg')}${pill('food', 'veg', 'Veg')}</div></div>
      <button class="btn acc" type="submit">${me ? 'Save changes' : 'Confirm my place'}</button>
      ${me ? '<button type="button" class="btn ghost" data-cancel>Cancel</button>' : ''}
    </form>${footer()}`;
}

// ------------------------------------------------------------------ events
function syncForm() {
  const f = $('rsvpForm'); if (!f || !form) return;
  for (const k of ['name', 'branch', 'phone', 'city', 'pickup']) if (f.elements[k]) form[k] = f.elements[k].value;
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-day]'); if (d) { day = +d.dataset.day; render(); return; }
  const s = e.target.closest('[data-set]');
  if (s) { syncForm(); const [k, v] = s.dataset.set.split('|'); form[k] = v === 'true' ? true : v === 'false' ? false : v; if (k === 'attend' && v === 'day1') form.overnight = false; render(); return; }
  if (e.target.closest('[data-edit]')) { form = { ...S.myRsvp, editing:true }; render(); return; }
  if (e.target.closest('[data-cancel]')) { form = null; render(); return; }
  const n = e.target.closest('[data-nom]'); if (n) { nomOpen = n.dataset.nom; render(); const i = document.querySelector('#nomForm input'); if (i) i.focus(); return; }
  if (e.target.closest('[data-nomclose]')) { nomOpen = null; render(); return; }
  const v = e.target.closest('[data-vote]');
  if (v) {
    const [eid, cid] = v.dataset.vote.split('|');
    const el = S.elections.find(x => x.id === eid), c = el.candidates.find(x => x.id === cid);
    pending = { eid, cid };
    $('askT').textContent = `Vote for ${c.name}?`;
    $('askP').textContent = `${el.title}. You can vote only once in this election.`;
    $('ask').showModal();
  }
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'nomForm') {
    e.preventDefault();
    const btn = f.querySelector('button:not([type=button])'); btn.disabled = true;
    try {
      const r = await fetch('/api/nominate', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ electionId: f.dataset.e, name: f.elements.name.value, note: f.elements.note.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Could not add');
      S = d; nomOpen = null; render(); toast('Nominee added. Share the link so people vote!');
    } catch (err) { toast(err.message); btn.disabled = false; }
    return;
  }
  if (f.id !== 'rsvpForm') return;
  e.preventDefault(); syncForm();
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    const r = await fetch('/api/rsvp', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(form) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not save');
    S = d; form = null; render(); scrollTo(0, 0); toast('You’re registered. See you there!');
  } catch (err) { toast(err.message); btn.disabled = false; }
});
$('askNo').onclick = () => $('ask').close();
$('askYes').onclick = async () => {
  $('ask').close();
  try {
    const r = await fetch('/api/vote', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ electionId: pending.eid, candidateId: pending.cid }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not record your vote');
    S = d; render(); toast('Your vote is counted');
  } catch (err) { toast(err.message); load(); }
};
addEventListener('hashchange', () => { if (route()[0] !== 'rsvp') form = null; nomOpen = null; render(); scrollTo(0, 0); });
load();
setInterval(() => { if (route()[0] !== 'rsvp' && !nomOpen && !$('ask').open) load(); }, 60000);
</script>
</body>
</html>
