<style>

        <div class="meta">Keep it friendly and respectful.</div></form>`
    : `<div class="composer"><div class="in" style="justify-content:center"><a class="btn acc" href="#chat" style="width:100%">${C.status === 'pending' ? 'Plan request pending' : C.status === 'active' ? 'Get more messages to reply' : 'Choose a plan to reply'}</a></div></div>`;
  v.innerHTML = `<div class="thead"><a class="bk" href="#chat" aria-label="Back to chat">‹</a>${p.committee ? `<div class="wav adm" style="width:40px;height:40px">${svg(P.info, 18)}</div>` : `<div class="wav" style="width:40px;height:40px;font-size:16px;background:${avColor(p.name)}">${esc(String(p.name).charAt(0))}</div>`}<div><div style="font-weight:600;color:#111B21">${esc(p.name)}</div><div style="font-size:12px;color:var(--muted)">${esc([p.branch, p.city].filter(Boolean).join(' · '))}</div></div></div>
    <div class="msgs">${msgs || '<div class="empty">Say hello to ' + esc(first(p.name)) + '!</div>'}</div>${composer}`;
  scrollTo(0, document.body.scrollHeight);
}

// ------------------------------------------------------------------ events
function syncForm() {
  const f = $('rsvpForm'); if (!f || !form) return;
  for (const k of ['name', 'branch', 'phone', 'city', 'pickup']) if (f.elements[k]) form[k] = f.elements[k].value;
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-day]'); if (d) { day = +d.dataset.day; render(); return; }
  if (e.target.closest('[data-emotoggle]')) { draft = $('msg') ? $('msg').value : draft; emoOpen = !emoOpen; if (!emoOpen) caret = null; paintChat(route()[1]); if (!emoOpen) $('msg')?.focus(); return; }
  const ec = e.target.closest('[data-emocat]'); if (ec) { draft = $('msg') ? $('msg').value : draft; emoCat = +ec.dataset.emocat; paintChat(route()[1]); return; }
  const em = e.target.closest('[data-emo]'); if (em) { const ta = $('msg'); if (ta) { const a = caret ? caret[0] : ta.value.length, b = caret ? caret[1] : a; ta.value = ta.value.slice(0, a) + em.dataset.emo + ta.value.slice(b); draft = ta.value; caret = [a + em.dataset.emo.length, a + em.dataset.emo.length]; } return; }
  const rp = e.target.closest('[data-replay]'); if (rp) { gameMounted = ''; renderGame(rp.dataset.replay); return; }
  const pr = e.target.closest('[data-phrev]'); if (pr) { const [id, st] = pr.dataset.phrev.split('|'); api2(`/api/album/${id}/review`, { status: st }).then(() => { toast(st === 'approved' ? 'Photo approved' : 'Photo rejected'); AL = null; renderAlbum(); }).catch(err => toast(err.message)); return; }
  const pf = e.target.closest('[data-pf]'); if (pf) { peopleF = pf.dataset.pf; paintChat(route()[1]); return; }
  const mo = e.target.closest('[data-month]'); if (mo) { pickMonth(mo.dataset.month); return; }
  if (e.target.closest('[data-import]')) { impStart(); return; }
  const tm = e.target.closest('[data-team]'); if (tm) { const t = S.elections.find(x => x.id === tm.dataset.team); if (t) { const n = teamNames(t);
    $('tmBox').innerHTML = `<div style="display:flex;gap:12px;align-items:center">${icon(t)}<h3 id="tmT" style="margin:0">${esc(t.title)}</h3></div>
      <p style="margin-top:12px">${esc(t.desc)}</p>
      <div class="lb" style="margin-top:14px">${t.id === 'media' ? 'Confirmed' : n.length > 1 ? 'Confirmed coordinators' : 'Confirmed coordinator'}</div>
      ${n.length ? `<div class="oc-ppl" style="margin-top:6px">${n.map(x => `<span style="font-size:14.5px">${svg(P.check, 15)}${esc(x)}</span>`).join('')}</div>` : `<div class="oc-tbc" style="font-size:14px">${svg(HOUR_IC, 15)}<span>To be confirmed</span></div>`}
      <div class="row" style="margin-top:18px">${isLive(t) ? `<a class="btn acc" href="#vote/${esc(t.id)}" data-tmclose>View poll</a>` : ''}<button type="button" class="btn ghost" data-tmclose>Close</button></div>`;
    $('tmDlg').showModal(); } return; }
  if (e.target.closest('[data-tmclose]')) { $('tmDlg').close(); if (!e.target.closest('a')) return; }
  const ph = e.target.closest('[data-ph]'); if (ph) { showPhoto(ph.dataset.ph); return; }
  if (e.target.closest('[data-phclose]')) { $('phDlg').close(); return; }
  const pd = e.target.closest('[data-phdel]'); if (pd) { (async () => { try { await fetch('/api/album/' + encodeURIComponent(pd.dataset.phdel), { method:'DELETE' }); $('phDlg').close(); AL = null; renderAlbum(); toast('Photo removed'); } catch (err) { toast(err.message); } })(); return; }
  if (e.target.closest('[data-alzip]')) { zipAll(); return; }
  if (e.target.closest('[data-impclose]')) { $('impDlg').close(); return; }
  if (e.target.closest('[data-impgo]')) { (async () => { const b = e.target.closest('[data-impgo]'); b.disabled = true;
    try { const r = await fetch('/api/admin/import', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': impPw }, body: JSON.stringify({ rows: impRows }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Import failed');
      $('impDlg').close(); toast(`Imported ${d.added} contact${d.added === 1 ? '' : 's'}${d.skipped ? ` · ${d.skipped} skipped (already there or no number)` : ''}`); load();
    } catch (err) { toast(err.message); b.disabled = false; } })(); return; }
  const s = e.target.closest('[data-set]');
  if (s) { syncForm(); const [k, v] = s.dataset.set.split('|'); form[k] = v === 'true' ? true : v === 'false' ? false : v; if (k === 'attend' && v === 'day1') form.overnight = false; render(); return; }
  if (e.target.closest('[data-edit]')) { form = { ...S.myRsvp, editing:true }; rsvpStep = 0; render(); return; }
  const cn = e.target.closest('[data-cnt]'); if (cn) { syncForm(); const [key, d] = cn.dataset.cnt.split('|');
    if (key === 'kids') { if (+d > 0 && form.kids.length < 8) form.kids.push(5); else if (+d < 0) form.kids.pop(); }
    else form.others = Math.max(0, Math.min(10, (+form.others || 0) + +d)); render(); return; }
  const sp = e.target.closest('[data-step]'); if (sp) { syncForm();
    if (+sp.dataset.step > 0 && rsvpStep === 0) { const ph = String(form.phone || '').replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
      if (String(form.name || '').trim().length < 2) return toast('Please enter your full name');
      if (!form.gender) return toast('Please choose Male or Female');
      if (!/^\d{10}$/.test(ph)) return toast('Please enter a 10-digit mobile number'); }
    rsvpStep = Math.max(0, Math.min(5, rsvpStep + +sp.dataset.step)); render(); scrollTo(0, 0); return; }
  if (e.target.closest('[data-cancel]')) { form = null; rsvpStep = 0; render(); return; }
  if (e.target.closest('[data-recheck]')) { load().then(() => { if (S) { location.hash = '#home'; toast('Welcome! You’re approved.'); } else toast('Not approved yet'); }); return; }
  if (e.target.closest('[data-signout]')) { api2('/api/auth/logout', {}).then(() => { S = null; C = null; form = null; location.hash = '#home'; showSignin(); }); return; }
  const pp = e.target.closest('[data-pickpass]');
  if (pp) { form = S.myRsvp ? { ...S.myRsvp, editing:true, pass: pp.dataset.pickpass } : { pass: pp.dataset.pickpass, name:'', gender:'', branch:'', phone:'', city:'', attend:'both', overnight:false, pickup:'', food:'nonveg' }; keepForm = true; location.hash = '#rsvp'; return; }
  if (e.target.closest('[data-wainfo]')) { $('waIc').innerHTML = WA_ICON; $('waDlg').showModal(); return; }
  const pl = e.target.closest('[data-plan]');
  if (pl) { api2('/api/chat/request', { plan: pl.dataset.plan }).then(d => { C = d; showPlans = false; paintChat(); toast('Request sent to admin'); scrollTo(0, 0); }).catch(err => toast(err.message)); return; }
  if (e.target.closest('[data-cancelreq]')) { api2('/api/chat/request', { cancel: true }).then(d => { C = d; paintChat(); }).catch(err => toast(err.message)); return; }
  if (e.target.closest('[data-showplans]')) { showPlans = !showPlans; paintChat(); return; }
  const wv = e.target.closest('[data-watch]');
  if (wv) {
    const [eid, cid] = wv.dataset.watch.split('|');
    const c = S.elections.find(x => x.id === eid).candidates.find(x => x.id === cid);
    if (c.video.src) { $('vidBox').style.paddingTop = '0'; $('vidBox').innerHTML = `<video src="${esc(c.video.src)}" ${c.video.poster ? `poster="${esc(c.video.poster)}"` : ''} controls playsinline autoplay style="display:block;width:100%;max-height:76vh;background:#000"></video>`; }
    else { const portrait = c.video.kind === 'youtube' && /shorts/.test(c.video.url) || c.video.kind === 'drive';
    $('vidBox').style.paddingTop = portrait ? '150%' : '56.25%';
    $('vidBox').innerHTML = `<iframe src="${esc(c.video.embed)}" title="Campaign video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>`; }
    $('vidName').innerHTML = `${esc(c.name)} <button type="button" class="cv-like ${c.video.liked ? 'on' : ''}" style="position:static;margin-left:8px" data-like="${esc(eid)}|${esc(cid)}" aria-label="Like">${svg(HEART, 15)}<span>${c.video.likes}</span></button>`; $('vidDlg').showModal(); return;
  }
  const lk = e.target.closest('[data-like]'); if (lk) { const [eid, cid] = lk.dataset.like.split('|'); (async () => { try { const d = await api2('/api/campaign/like', { electionId: eid, candidateId: cid });
    const c = S.elections.find(x => x.id === eid).candidates.find(x => x.id === cid); c.video.liked = d.liked; c.video.likes = d.likes; render(); const dl = $('vidName').querySelector('[data-like]'); if (dl) { dl.classList.toggle('on', d.liked); dl.querySelector('span').textContent = d.likes; } } catch (err) { toast(err.message); } })(); return; }
  const cp = e.target.closest('[data-camp]'); if (cp) { campOpen = cp.dataset.camp; render(); return; }
  if (e.target.closest('[data-campclose]')) { campOpen = null; render(); return; }
  const n = e.target.closest('[data-nom]'); if (n) { nomOpen = n.dataset.nom; render(); const i = document.querySelector('#nomForm input'); if (i) i.focus(); return; }
  if (e.target.closest('[data-nomclose]')) { nomOpen = null; render(); return; }
  const v = e.target.closest('[data-vote]');
  if (v) {
    const [eid, cid] = v.dataset.vote.split('|');
    const el = S.elections.find(x => x.id === eid), c = el.candidates.find(x => x.id === cid);
    pending = { eid, cid };
    $('askT').textContent = `Vote for ${c.name}?`;
    $('askP').textContent = `${el.title}. You can vote only once in this election.`;
    $('ask').showModal();
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'impPwForm') { e.preventDefault(); const pw = $('impPw').value;
    try { const r = await fetch('/api/admin/ping', { headers:{ 'x-admin-password': pw } }); if (!r.ok) throw new Error('Wrong admin password'); impPw = pw; impFileStep(); }
    catch (err) { toast(err.message); } return; }
  const f = e.target;
  if (f.id === 'campForm') {
    e.preventDefault();
    if (!f.elements.cand.value) { toast('Choose your name'); return; }
    try { await api2('/api/campaign', { electionId: f.dataset.e, candidateId: f.elements.cand.value, url: f.elements.url.value }); campOpen = null; render(); toast('Sent. It appears once the committee approves it.'); }
    catch (err) { toast(err.message); }
    return;
  }
  if (f.id === 'testSignin') { e.preventDefault(); finishSignin(`test:${f.elements.email.value}:${f.elements.name.value}:${f.elements.email.value}`); return; }
  if (f.id === 'consentForm') {
    e.preventDefault();
    if (!f.elements.agree.checked) { toast('Please tick the box to accept the rules'); return; }
    try { C = await api2('/api/chat/consent', { agree: true }); paintChat(); scrollTo(0, 0); } catch (err) { toast(err.message); }
    return;
  }
  if (f.id === 'sendForm') {
    e.preventDefault();
    const ta = $('msg'), text = ta.value.trim(); if (!text) return;
    const btn = f.querySelector('button'); btn.disabled = true;
    try { await api2('/api/chat/send', { to: route()[1], text }); draft = ''; await loadChat(route()[1]); }
    catch (err) { toast(err.message); btn.disabled = false; }
    return;
  }
  if (f.id === 'nomForm') {
    e.preventDefault();
    const btn = f.querySelector('button:not([type=button])'); btn.disabled = true;
    try {
      const r = await fetch('/api/nominate', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ electionId: f.dataset.e, name: f.elements.name.value, note: f.elements.note.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Could not add');
      S = d; nomOpen = null; render(); toast('Nominee added. Share the link so people vote!');
    } catch (err) { toast(err.message); btn.disabled = false; }
    return;
  }
  if (f.id !== 'rsvpForm') return;
  e.preventDefault(); syncForm();
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    const r = await fetch('/api/rsvp', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(form) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not save');
    S = d; form = null; rsvpStep = 0; render(); scrollTo(0, 0); toast('You’re registered. See you there!');
  } catch (err) { toast(err.message); btn.disabled = false; }
});
$('askNo').onclick = () => $('ask').close();
$('waOk').onclick = () => $('waDlg').close();
$('vidClose').onclick = () => $('vidDlg').close();
$('vidDlg').addEventListener('close', () => { $('vidBox').innerHTML = ''; });
$('askYes').onclick = async () => {
  $('ask').close();
  try {
    const r = await fetch('/api/vote', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ electionId: pending.eid, candidateId: pending.cid }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not record your vote');
    S = d; render(); toast('Your vote is counted');
  } catch (err) { toast(err.message); load(); }
};
addEventListener('hashchange', () => {
  if (document.body.classList.contains('signin')) { showSignin(); scrollTo(0, 0); return; }
  if (route()[0] !== 'rsvp') form = null;
  else if (!keepForm) form = null;
  keepForm = false;
  nomOpen = null; campOpen = null; draft = ''; emoOpen = false; showPlans = false; if (route()[0] === 'members') MEM = null;
  if (route()[0] === 'chat') { thread = route()[1] && route()[1] !== 'new' ? null : thread; loadChat(route()[1]); }
  render(); scrollTo(0, 0);
  track('page');
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.monthsel !== undefined && e.target.value) { pickMonth(e.target.value); return; }
  if (e.target.dataset && e.target.dataset.kid !== undefined && form) { form.kids[+e.target.dataset.kid] = +e.target.value; return; }
  if (e.target.id === 'alFile' && e.target.files.length) { uploadPhotos([...e.target.files]); return; }
  if (e.target.id === 'impFile' && e.target.files[0]) { (async () => {
    try { impRows = await readContacts(e.target.files[0]);
      if (!impRows.length) throw new Error('No phone numbers found in this file.');
      impShow(`<div class="imp-ic">${svg(IMP, 22)}</div><h3 id="impT">Import ${impRows.length} contact${impRows.length === 1 ? '' : 's'}?</h3>
        <p>They are added to the registered list as “Imported from WhatsApp”. Numbers already in the app are skipped.</p>
        <div class="imp-prev">${impRows.slice(0, 5).map(x => `<div><b>${esc(x.name || '—')}</b><span>${esc(x.phone)}</span></div>`).join('')}${impRows.length > 5 ? `<div style="color:var(--muted)">and ${impRows.length - 5} more…</div>` : ''}</div>
        <div class="row" style="margin-top:14px"><button type="button" class="btn ghost" data-impclose>Cancel</button><button type="button" class="btn acc" data-impgo>Import</button></div>`);
    } catch (err) { toast(err.message); } })(); return; }
  if (e.target.id === 'privacyOk') { $('gwrap').classList.toggle('off', !e.target.checked); $('gHint').textContent = e.target.checked ? 'Continue with your Google account.' : 'Tick the box above to continue with Google.'; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'msg') { caret = [e.target.selectionStart, e.target.selectionEnd]; draft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }
  if (e.target.id === 'pq') { peopleQ = e.target.value; const pos = e.target.selectionStart; paintChat(route()[1]); const n = $('pq'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('selectionchange', () => { const ta = document.activeElement; if (ta && ta.id === 'msg') caret = [ta.selectionStart, ta.selectionEnd]; });
document.addEventListener('keydown', e => { if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); $('sendForm').requestSubmit(); } });
setInterval(() => { const [r, a] = route(); if (r === 'chat' && a !== 'new' && document.activeElement?.id !== 'msg' && !emoOpen) loadChat(a); }, 8000);
fetch('/api/config').then(r => r.json()).then(c => { CFG = c; }).catch(() => {}).finally(load);
setInterval(() => { if (S && !['rsvp', 'chat'].includes(route()[0]) && !nomOpen && !campOpen && !$('ask').open && !$('vidDlg').open) load(); }, 60000);
</script>
</body>
